name: TapTap 兑换码扫描

on:
  schedule:
    - cron: '0 0 * * *'
    - cron: '0 12 * * *'
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore cache
        id: cache-restore
        uses: actions/cache@v4
        with:
          path: pushed_codes.json
          key: taptap-codes-${{ github.run_id }}
          restore-keys: |
            taptap-codes-

      - name: Run scanner
        env:
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
        run: python scanner.py

      - name: Save cache
        uses: actions/cache@v4
        with:
          path: pushed_codes.json
          key: taptap-codes-${{ github.run_id }}